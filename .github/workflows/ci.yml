name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  # 编译验证构建：只证明公开树可构建，不注入任何 secret、不上传/发布
  # 产物。正式包仍由维护者在本地用发布脚本 + release keystore 构建，
  # 校验和随 Release 公布。
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile check (debug APK)
        run: flutter build apk --debug --target-platform android-arm64

  # Release 配置编译验证：R8 收缩/混淆链路在 CI 也必须可过（产物丢弃，
  # 不签名、不上传——CI 产物不是发布物，发布 APK 的签名指纹见 README
  # "Verifying downloads"）。
  release-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile check (release, artifact discarded)
        run: flutter build apk --release --target-platform android-arm64

  # 注释内部引用守卫：仓库内不得引用不存在的内部文档/审查编号。
  internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check comments for internal references
        run: python3 .github/scripts/check_internal_refs.py . --check
