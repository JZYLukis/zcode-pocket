# Release 资产独立复核（ci-sign-verify，用户 2026-11-13 拍板）：
# 本地 check_public_apk.py 五断言的执行者=上传者——此 workflow 在
# release published 事件独立复验（验签用公钥指纹，无任何私钥，
# 与 decisions #18 本地签名决策不冲突）。
# 断言：①签名证书 SHA-256 == 官方指纹 ②SHA256SUMS 与资产逐一匹配
# ③版本形态（zcode-pocket-<版本>-<abi>.apk + versionName 为纯 SemVer）
# ④HMS 零携带（agconnect/huawei 类扫描）。
name: Release verify

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir assets --clobber
          ls -la assets/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify APK signatures (official fingerprint)
        run: |
          EXPECTED="2e079b31d61d3f6fbbc5aa4fc9ed0cb0d2787b4de7e558345b630a59c546b681"
          fail=0
          for apk in assets/*.apk; do
            DIGEST=$(apksigner verify --print-certs "$apk" | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
            echo "$(basename "$apk"): $DIGEST"
            [ "$DIGEST" = "$EXPECTED" ] || { echo "::error::$(basename "$apk") 签名指纹不符"; fail=1; }
          done
          exit $fail

      - name: Verify SHA256SUMS
        run: |
          cd assets
          sha256sum -c SHA256SUMS

      - name: Scan for HMS artifacts
        run: |
          fail=0
          for apk in assets/*.apk; do
            if unzip -l "$apk" | grep -qiE "agconnect|huawei|libml-"; then
              echo "::error::$(basename "$apk") 含 HMS 产物"; fail=1
            fi
          done
          exit $fail

      - name: Naming convention
        run: |
          VER="${GITHUB_REF_NAME#v}"
          fail=0
          for apk in assets/*.apk; do
            base=$(basename "$apk")
            echo "$base" | grep -qE "^zcode-pocket-${VER//./\.}-(arm64-v8a|armeabi-v7a|x86_64)\.apk$" \
              || { echo "::error::资产命名不符规范：$base"; fail=1; }
          done
          exit $fail
