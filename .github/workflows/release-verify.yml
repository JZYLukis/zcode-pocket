# Release 资产独立复核（用户拍板）：
# 本地 check_public_apk.py 五断言的执行者=上传者——此 workflow 在
# release published 事件独立复验（验签用公钥指纹，无任何私钥）。
# 断言：①签名证书 SHA-256 == 官方指纹 ②SHA256SUMS 与资产逐一匹配
# ③版本形态（zcode-pocket-<版本>-<abi>.apk + versionName 为纯 SemVer）
# ④HMS 零携带（agconnect/huawei 类扫描）。
# workflow_dispatch=对已发布版本手动补跑（overlay 迁移后首例）。
name: Release verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v1.0.6)'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying release: $TAG"
          # 无 checkout 步骤——gh 需显式仓库上下文（否则尝试 git 解析
          # 报 not a git repository，首跑实证）。
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          ls -la assets/

      - name: Set up Android build-tools (apksigner)
        run: |
          # runner 不预装 Android SDK；Flutter release 仅 v2 签名
          #（keytool -jarfile 读不了，本地实证）——apksigner 是唯一
          # 轻量读 v2 指纹的路。固定路径装 cmdline-tools+build-tools。
          curl -sSLo /tmp/cmdt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p ~/sdk/cmdline-tools
          unzip -q /tmp/cmdt.zip -d ~/sdk/cmdline-tools
          mv ~/sdk/cmdline-tools/cmdline-tools ~/sdk/cmdline-tools/latest
          SDKM=~/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "build-tools;34.0.0" >/dev/null
          BT=$(dirname "$(find ~/sdk -name apksigner | head -1)")
          echo "apksigner at: $BT"
          echo "PATH=$BT:$PATH" >> "$GITHUB_ENV"

      - name: Verify APK signatures (official fingerprint)
        run: |
          EXPECTED="2e079b31d61d3f6fbbc5aa4fc9ed0cb0d2787b4de7e558345b630a59c546b681"
          fail=0
          for apk in assets/*.apk; do
            DIGEST=$(apksigner verify --print-certs "$apk" | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
            echo "$(basename "$apk"): $DIGEST"
            [ "$DIGEST" = "$EXPECTED" ] || { echo "::error::$(basename "$apk") 签名指纹不符"; fail=1; }
          done
          exit $fail

      - name: Verify SHA256SUMS
        run: |
          cd assets
          sha256sum -c SHA256SUMS

      - name: Scan for HMS artifacts
        run: |
          fail=0
          for apk in assets/*.apk; do
            if unzip -l "$apk" | grep -qiE "agconnect|huawei|libml-"; then
              echo "::error::$(basename "$apk") 含 HMS 产物"; fail=1
            fi
          done
          exit $fail

      - name: Naming convention
        run: |
          VER="${TAG#v}"
          fail=0
          for apk in assets/*.apk; do
            base=$(basename "$apk")
            echo "$base" | grep -qE "^zcode-pocket-${VER//./\.}-(arm64-v8a|armeabi-v7a|x86_64)\.apk$" \
              || { echo "::error::资产命名不符规范：$base"; fail=1; }
          done
          exit $fail
