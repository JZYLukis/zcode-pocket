name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also describe what you expected instead. （发生了什么，以及期望的行为）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About ZCode Pocket → version line (includes a commit id)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: e.g. Pixel 8 / Android 14, or a foldable model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
