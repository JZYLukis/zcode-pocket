# 堆配置说明（开源审查 Q2 P3-4）：8G/4G 是维护者大仓库（多 ABI+R8+
# AGP9）经验值；开源贡献者常规机器可降到 -Xmx4G -XX:MaxMetaspaceSize=2G
# （单 ABI debug 构建足够），按需上调即可。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 增量编译在含空格的仓库路径下 FilePageCache 报错
# "Could not close incremental caches"（Windows 已知问题）——关闭增量绕过
kotlin.incremental=false

# 阶段2（2026-10-15）：国际网络间歇黑洞时依赖解析无限挂起——
# 短超时让坏仓库快速失败（依赖已全部缓存，正常路径不受影响）
systemProp.org.gradle.internal.http.socketTimeout=10000
systemProp.org.gradle.internal.http.connectionTimeout=10000
